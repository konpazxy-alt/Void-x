# VOID X - SATU FILE. Seluruh project (kode, resource, kunci debug) ada di dalam file ini.
# Simpan sebagai: .github/workflows/build.yml  -> build otomatis berjalan di GitHub Actions.
name: Build VOID X

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Tulis seluruh project VOID X
        run: |
          mkdir -p VOID-X
          cd VOID-X
          mkdir -p app app/src/main app/src/main/java/com/voidx/launcher/data app/src/main/java/com/voidx/launcher/home app/src/main/java/com/voidx/launcher/ui app/src/main/res/drawable app/src/main/res/layout app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VOID-X"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          cat > .gitignore <<'EOF'
          .gradle/
          build/
          local.properties
          .idea/
          *.iml
          .DS_Store
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.voidx.launcher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.voidx.launcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              // Kunci debug tetap (ikut di repo) supaya APK versi baru bisa
              // dipasang menimpa versi lama tanpa uninstall. Hanya untuk debug.
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
