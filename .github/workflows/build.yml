          cat > app/src/main/java/com/voidx/launcher/data/AppInfo.kt <<'EOF'
          package com.voidx.launcher.data

          import android.content.ComponentName
          import android.graphics.drawable.Drawable

          /**
           * Satu aplikasi yang bisa dibuka dari launcher (satu activity berkategori LAUNCHER).
           */
          class AppInfo(
              val label: String,
              val packageName: String,
              val className: String,
              val isSystemApp: Boolean,
              val icon: Drawable
          ) {
              val component: ComponentName
                  get() = ComponentName(packageName, className)
          }
          EOF
          cat > app/src/main/java/com/voidx/launcher/data/AppRepository.kt <<'EOF'
          package com.voidx.launcher.data

          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.os.Build
          import java.util.Locale

          /**
           * Sumber data aplikasi terpasang. Memakai PackageManager (resmi) dan
           * tidak membutuhkan izin QUERY_ALL_PACKAGES — cukup deklarasi <queries> di manifest.
           *
           * Panggil [loadLaunchableApps] dari thread latar belakang (memuat ikon cukup berat).
           */
          class AppRepository(private val context: Context) {

              @Suppress("DEPRECATION")
              fun loadLaunchableApps(): List<AppInfo> {
                  val packageManager = context.packageManager
                  val launcherIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)

                  val activities = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      packageManager.queryIntentActivities(
                          launcherIntent,
                          PackageManager.ResolveInfoFlags.of(0L)
                      )
                  } else {
                      packageManager.queryIntentActivities(launcherIntent, 0)
                  }

                  return activities
                      .filter { it.activityInfo.packageName != context.packageName }
                      .mapNotNull { resolveInfo ->
                          try {
                              val activityInfo = resolveInfo.activityInfo
                              val appFlags = activityInfo.applicationInfo.flags
                              AppInfo(
                                  label = resolveInfo.loadLabel(packageManager).toString(),
                                  packageName = activityInfo.packageName,
                                  className = activityInfo.name,
                                  isSystemApp = (appFlags and ApplicationInfo.FLAG_SYSTEM) != 0,
                                  icon = resolveInfo.loadIcon(packageManager)
                              )
                          } catch (e: Exception) {
                              // Satu aplikasi bermasalah tidak boleh menggagalkan seluruh daftar.
                              null
                          }
                      }
                      .sortedBy { it.label.lowercase(Locale.getDefault()) }
              }
          }
          EOF
          cat > app/src/main/java/com/voidx/launcher/ui/AppGridAdapter.kt <<'EOF'
          package com.voidx.launcher.ui

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import com.voidx.launcher.R
          import com.voidx.launcher.data.AppInfo

          /**
           * Adapter grid ikon aplikasi.
           *
           * @param onClick dipanggil saat ikon diketuk; View kedua adalah ikon (sumber animasi buka app).
           * @param onLongClick dipanggil saat ikon ditekan lama; View kedua adalah anchor menu.
           */
          class AppGridAdapter(
              private val onClick: (AppInfo, View) -> Unit,
              private val onLongClick: (AppInfo, View) -> Unit
          ) : RecyclerView.Adapter<AppGridAdapter.ViewHolder>() {

              private var items: List<AppInfo> = emptyList()

              fun submit(newItems: List<AppInfo>) {
                  items = newItems
                  notifyDataSetChanged()
              }

              override fun getItemCount(): Int = items.size

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                  val view = LayoutInflater.from(parent.context).inflate(R.layout.item_app, parent, false)
                  return ViewHolder(view)
              }

              override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                  val app = items[position]
                  holder.icon.setImageDrawable(app.icon)
                  holder.label.text = app.label
                  holder.itemView.setOnClickListener { onClick(app, holder.icon) }
                  holder.itemView.setOnLongClickListener {
                      onLongClick(app, holder.itemView)
                      true
                  }
              }

              class ViewHolder(view: View) : RecyclerView.ViewHolder(view) {
                  val icon: ImageView = view.findViewById(R.id.appIcon)
                  val label: TextView = view.findViewById(R.id.appLabel)
              }
          }
          EOF
          cat > app/src/main/java/com/voidx/launcher/home/HomeActivity.kt <<'EOF'
          package com.voidx.launcher.home

          import android.app.Activity
          import android.app.ActivityOptions
          import android.app.role.RoleManager
          import android.content.ActivityNotFoundException
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.View
          import android.widget.PopupMenu
          import android.widget.Toast
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.voidx.launcher.R
          import com.voidx.launcher.data.AppInfo
          import com.voidx.launcher.data.AppRepository
          import com.voidx.launcher.ui.AppGridAdapter
          import java.util.concurrent.Executors

          /**
           * Layar Home VOID X (Tahap 1: fondasi).
           *
           * - Terdaftar sebagai HOME di manifest, sehingga bisa dipilih sebagai launcher default.
           * - Wallpaper sistem tampil di belakang (tema windowShowWallpaper).
           * - Memuat semua aplikasi terpasang lewat PackageManager (di thread latar belakang).
           * - Ketuk ikon = buka aplikasi; tekan lama = Info aplikasi / Copot pemasangan.
           * - Daftar otomatis diperbarui saat aplikasi dipasang, dihapus, atau diperbarui.
           */
          class HomeActivity : Activity() {

              private lateinit var repository: AppRepository
              private lateinit var adapter: AppGridAdapter
              private lateinit var appGrid: RecyclerView
              private lateinit var defaultBanner: View

              private val mainHandler = Handler(Looper.getMainLooper())
              private val ioExecutor = Executors.newSingleThreadExecutor()
              private var loadGeneration = 0

              private val reloadRunnable = Runnable { reloadApps() }

              private val packageReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      // Beberapa broadcast datang beruntun saat update aplikasi; gabungkan jadi satu muat ulang.
                      mainHandler.removeCallbacks(reloadRunnable)
                      mainHandler.postDelayed(reloadRunnable, RELOAD_DEBOUNCE_MS)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_home)

                  repository = AppRepository(applicationContext)
                  defaultBanner = findViewById(R.id.defaultBanner)
                  findViewById<View>(R.id.defaultButton).setOnClickListener { requestDefaultLauncher() }

                  adapter = AppGridAdapter(
                      onClick = { app, view -> launchApp(app, view) },
                      onLongClick = { app, view -> showAppMenu(app, view) }
                  )

                  appGrid = findViewById(R.id.appGrid)
                  appGrid.layoutManager = GridLayoutManager(this, calculateColumns())
                  appGrid.setHasFixedSize(true)
                  appGrid.adapter = adapter

                  registerPackageReceiver()
                  reloadApps()
              }

              override fun onResume() {
                  super.onResume()
                  // Banner hanya tampil selama VOID X belum menjadi launcher default.
                  defaultBanner.visibility = if (isDefaultLauncher()) View.GONE else View.VISIBLE
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  // Tombol Home ditekan saat VOID X sudah di depan: kembali ke posisi atas.
                  if (intent?.hasCategory(Intent.CATEGORY_HOME) == true) {
                      appGrid.smoothScrollToPosition(0)
                  }
              }

              @Suppress("OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
                  // Launcher tidak keluar dengan tombol Kembali.
              }

              override fun onDestroy() {
                  mainHandler.removeCallbacksAndMessages(null)
                  try {
                      unregisterReceiver(packageReceiver)
                  } catch (e: IllegalArgumentException) {
                      // Receiver sudah tidak terdaftar.
                  }
                  ioExecutor.shutdown()
                  super.onDestroy()
              }

              // ---------------------------------------------------------------- data

              private fun reloadApps() {
                  val generation = ++loadGeneration
                  ioExecutor.execute {
                      val apps = repository.loadLaunchableApps()
                      mainHandler.post {
                          // Abaikan hasil lama jika sudah ada muat ulang yang lebih baru.
                          if (generation == loadGeneration && !isDestroyed) {
                              adapter.submit(apps)
                          }
                      }
                  }
              }

              private fun registerPackageReceiver() {
                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_PACKAGE_ADDED)
                      addAction(Intent.ACTION_PACKAGE_REMOVED)
                      addAction(Intent.ACTION_PACKAGE_CHANGED)
                      addAction(Intent.ACTION_PACKAGE_REPLACED)
                      addDataScheme("package")
                  }
                  ContextCompat.registerReceiver(
                      this,
                      packageReceiver,
                      filter,
                      ContextCompat.RECEIVER_NOT_EXPORTED
                  )
              }

              // ------------------------------------------------------- tata letak

              private fun calculateColumns(): Int {
                  val metrics = resources.displayMetrics
                  val widthDp = metrics.widthPixels / metrics.density
                  return (widthDp / ITEM_WIDTH_DP).toInt().coerceIn(MIN_COLUMNS, MAX_COLUMNS)
              }

              // ------------------------------------------------------ buka aplikasi

              private fun launchApp(app: AppInfo, sourceView: View) {
                  val intent = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                      component = app.component
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED
                  }
                  try {
                      // Animasi membesar dari posisi ikon.
                      val options = ActivityOptions.makeScaleUpAnimation(
                          sourceView, 0, 0, sourceView.width, sourceView.height
                      )
                      startActivity(intent, options.toBundle())
                  } catch (e: ActivityNotFoundException) {
                      toast(R.string.toast_cannot_open)
                  } catch (e: SecurityException) {
                      toast(R.string.toast_cannot_open)
                  }
              }

              // ------------------------------------------------------------- menu

              private fun showAppMenu(app: AppInfo, anchor: View) {
                  val popup = PopupMenu(this, anchor)
                  popup.menu.add(0, MENU_INFO, 0, R.string.menu_app_info)
                  if (!app.isSystemApp) {
                      popup.menu.add(0, MENU_UNINSTALL, 1, R.string.menu_uninstall)
                  }
                  popup.setOnMenuItemClickListener { item ->
                      when (item.itemId) {
                          MENU_INFO -> openAppInfo(app)
                          MENU_UNINSTALL -> uninstallApp(app)
                      }
                      true
                  }
                  popup.show()
              }

              private fun openAppInfo(app: AppInfo) {
                  val intent = Intent(
                      Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                      Uri.fromParts("package", app.packageName, null)
                  )
                  startActivitySafely(intent)
              }

              private fun uninstallApp(app: AppInfo) {
                  val intent = Intent(Intent.ACTION_DELETE, Uri.fromParts("package", app.packageName, null))
                  startActivitySafely(intent)
              }

              private fun startActivitySafely(intent: Intent) {
                  try {
                      startActivity(intent)
                  } catch (e: ActivityNotFoundException) {
                      toast(R.string.toast_action_failed)
                  } catch (e: SecurityException) {
                      toast(R.string.toast_action_failed)
                  }
              }

              // ------------------------------------------------- launcher default

              @Suppress("DEPRECATION")
              private fun isDefaultLauncher(): Boolean {
                  val homeIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                  val resolved = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      packageManager.resolveActivity(
                          homeIntent,
                          PackageManager.ResolveInfoFlags.of(PackageManager.MATCH_DEFAULT_ONLY.toLong())
                      )
                  } else {
                      packageManager.resolveActivity(homeIntent, PackageManager.MATCH_DEFAULT_ONLY)
                  }
                  return resolved?.activityInfo?.packageName == packageName
              }

              /**
               * Android 10+: dialog resmi "Jadikan aplikasi Home default" lewat RoleManager.
               * Versi lebih lama / jika dialog tidak tersedia: buka pengaturan aplikasi Home.
               */
              private fun requestDefaultLauncher() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val roleManager = getSystemService(RoleManager::class.java)
                          if (roleManager != null && roleManager.isRoleAvailable(RoleManager.ROLE_HOME)) {
                              startActivityForResult(
                                  roleManager.createRequestRoleIntent(RoleManager.ROLE_HOME),
                                  REQUEST_HOME_ROLE
                              )
                              return
                          }
                      }
                      startActivity(Intent(Settings.ACTION_HOME_SETTINGS))
                  } catch (e: ActivityNotFoundException) {
                      startActivitySafely(Intent(Settings.ACTION_SETTINGS))
                  }
              }

              private fun toast(messageRes: Int) {
                  Toast.makeText(this, messageRes, Toast.LENGTH_SHORT).show()
              }

              private companion object {
                  const val REQUEST_HOME_ROLE = 100
                  const val RELOAD_DEBOUNCE_MS = 400L
                  const val ITEM_WIDTH_DP = 84f
                  const val MIN_COLUMNS = 3
                  const val MAX_COLUMNS = 8
                  const val MENU_INFO = 1
                  const val MENU_UNINSTALL = 2
              }
          }
